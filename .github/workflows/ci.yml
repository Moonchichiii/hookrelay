name: ci

on:
  push:
    branches: [main]
  pull_request:

# Minimum token: nothing in this workflow writes to the repository.
permissions:
  contents: read

# Every uv invocation asserts that uv.lock matches pyproject.toml; a stale
# lock fails instead of being silently installed (--frozen would accept it).
env:
  UV_LOCKED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (immutable); the comment carries
# the tag the SHA was resolved from so updates stay reviewable.

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hookrelay:hookrelay@localhost:5432/hookrelay
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python version comes from .python-version (single source of truth).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Lockfile matches manifest
        run: uv lock --check

      - name: Install (locked)
        run: |
          uv sync --locked
          bun install --frozen-lockfile

      - name: Typecheck build tooling
        run: bun run typecheck:tools

      - name: Build assets
        run: bun run build

      - name: Hooks on the whole tree
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (strict)
        run: uv run mypy .

      - name: htmx 4 upgrade check
        run: bun run htmx:check

      - name: Django system checks
        run: uv run python manage.py check

      - name: Production deploy checks (WARNING is a failure)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: ci.hookrelay.example.test
        run: |
          export SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          uv run python manage.py check --deploy --fail-level WARNING

      - name: Migrations in sync
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Fresh migration against the CI database
        run: uv run python manage.py migrate --noinput

      # Fast lane, coverage floor enforced by pytest addopts. The concurrency
      # lane (-m "slow and not e2e") is added as a job with the first slow test.
      - name: Tests (fast lane, branch coverage >= 95%)
        run: uv run pytest -m "not slow and not e2e"

      - name: Boot smoke (uvicorn on the migrated database)
        run: |
          uv run uvicorn config.asgi:application --port 8000 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              curl -fsS http://127.0.0.1:8000/livez && exit 0
            fi
            sleep 1
          done
          echo "readyz never answered" && exit 1

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
          POSTGRES_DB: hookrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only production configuration for the final-image smoke.
      DATABASE_URL: postgresql://hookrelay:hookrelay@127.0.0.1:5432/hookrelay
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_HOSTS: 127.0.0.1,localhost
      PY: /app/.venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile owns every image reference (all digest-pinned); nothing
      # here overrides them.
      - name: Build final image (no cache)
        run: docker build --no-cache -t hookrelay:ci .

      - name: Runtime user is 65532
        run: test "$(docker inspect --format '{{.Config.User}}' hookrelay:ci)" = "65532"

      # The runtime has no shell: everything below is either a host-side
      # inspection of the exported rootfs or a direct interpreter invocation.
      - name: Export runtime rootfs and inspect it on the host
        run: |
          docker create --name hookrelay-inspect hookrelay:ci
          docker export hookrelay-inspect -o hookrelay-rootfs.tar
          docker rm hookrelay-inspect
          python3 scripts/inspect_rootfs.py hookrelay-rootfs.tar

      - name: Runtime executes Python 3.14.7 from the venv and imports the native stack
        run: |
          docker run --rm --entrypoint "$PY" hookrelay:ci -c '
          import sys, django, psycopg, uvloop, httptools
          version = ".".join(map(str, sys.version_info[:3]))
          print("python", version, "executable", sys.executable)
          assert sys.version_info[:3] == (3, 14, 7), version
          assert sys.executable.startswith("/app/.venv/bin/"), sys.executable
          print("imports ok:", django.__version__, psycopg.__version__, uvloop.__version__, httptools.__version__)'

      - name: Migrate through the final image (release command)
        run: |
          export SECRET_KEY="$(openssl rand -base64 48)"
          docker run --rm --network host \
            -e SECRET_KEY -e DATABASE_URL -e REDIS_URL -e ALLOWED_HOSTS \
            hookrelay:ci "$PY" manage.py migrate --noinput

      # Trust boundary: X-Forwarded-Proto is honoured only from FORWARDED_ALLOW_IPS.
      # On the bridge network the runner reaches the container from the bridge
      # gateway, not loopback, so the loopback default must reject the header
      # (301 = Django saw http) and the bridge subnet must accept it (200).
      - name: Boot the final image on the bridge network; probe livez, readyz and the trust boundary
        run: |
          export SECRET_KEY="$(openssl rand -base64 48)"
          subnet="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Subnet}}')"
          for allow in 127.0.0.1 "$subnet"; do
            docker rm -f hookrelay >/dev/null 2>&1 || true
            docker run -d --name hookrelay --add-host=host.docker.internal:host-gateway \
              -e SECRET_KEY -e ALLOWED_HOSTS \
              -e DATABASE_URL=postgresql://hookrelay:hookrelay@host.docker.internal:5432/hookrelay \
              -e REDIS_URL=redis://host.docker.internal:6379/0 \
              -e FORWARDED_ALLOW_IPS="$allow" hookrelay:ci
            ip="$(docker inspect --format '{{.NetworkSettings.IPAddress}}' hookrelay)"
            for i in $(seq 1 30); do curl -s -o /dev/null -H 'Host: localhost' "http://$ip:8080/livez" && break; sleep 1; done
            code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' -H 'X-Forwarded-Proto: https' "http://$ip:8080/readyz")"
            echo "FORWARDED_ALLOW_IPS=$allow, request from the bridge gateway with X-Forwarded-Proto: https -> $code"
            case "$allow" in
              127.0.0.1) test "$code" = "301" ;;
              *)
                test "$code" = "200"
                curl -fsS -H 'Host: localhost' -H 'X-Forwarded-Proto: https' "http://$ip:8080/livez"; echo
                curl -fsS -H 'Host: localhost' -H 'X-Forwarded-Proto: https' "http://$ip:8080/readyz"; echo
                curl -fsS -o /dev/null -w 'GET / %{http_code}\n' -H 'Host: localhost' -H 'X-Forwarded-Proto: https' "http://$ip:8080/" ;;
            esac
          done

      - name: Container logs
        if: always()
        run: docker logs hookrelay || true
