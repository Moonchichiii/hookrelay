name: security

# Runs on every change and once a day, so a vulnerability disclosed after a
# merge surfaces without waiting for the next commit.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python version comes from .python-version (single source of truth).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Lockfile matches manifest
        run: uv lock --check

      - name: Install (locked)
        run: |
          uv sync --locked
          bun install --frozen-lockfile

      # uv.lock is the single source of truth; the exports exist only for the
      # audit and carry artifact hashes so pip-audit can verify integrity.
      # There are no --ignore-vuln flags; see docs/security/README.md.
      - name: Audit production dependencies (hash-verified)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o /tmp/requirements-prod.txt
          uv run pip-audit --strict --require-hashes -r /tmp/requirements-prod.txt

      - name: Audit all dependency groups (hash-verified)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements.txt -o /tmp/requirements-all.txt
          uv run pip-audit --strict --require-hashes -r /tmp/requirements-all.txt

      - name: Audit frontend dependencies
        run: bun audit

      # Secondary, OSV-backed signal behind a uv preview flag. Non-blocking on
      # purpose: pip-audit above is the gate; this one adds adverse-status
      # checks (yanked, quarantined) and may change without notice.
      - name: uv audit (secondary signal, preview, non-blocking)
        continue-on-error: true
        run: uv audit --preview-features audit

      - name: Dependency tree (evidence for remediation)
        run: uv tree --all-groups

      # CycloneDX export is a uv preview feature (0.11): the flag acknowledges
      # that, and uv 0.11 echoes the document to stdout as well as the file.
      - name: Python SBOM (CycloneDX)
        run: uv export --locked --all-groups --no-emit-project --format cyclonedx1.5 --preview-features sbom-export -o sbom-python.json > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python
          path: sbom-python.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile owns every image reference (all digest-pinned); nothing
      # here overrides them.
      - name: Build final image (no cache)
        run: docker build --no-cache -t hookrelay:ci .

      # The SBOM is produced before the gate so it exists as evidence when the
      # scan goes red; generating it is inventory, not vulnerability scanning.
      # Trivy engine pinned explicitly: the action's embedded default lags
      # upstream.
      - name: Runtime image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: hookrelay:ci
          format: cyclonedx
          output: sbom-image.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: sbom-image.cdx.json

      # Zero known unsuppressed HIGH/CRITICAL findings in the final runtime
      # image at scan time, fixed or unfixed. No ignore file, no soft-fail.
      # An unfixed finding keeps this red until a reviewed VEX/waiver exists.
      # Input naming: the Trivy 0.74 CLI flag is --pkg-types, but this action
      # exposes it as `vuln-type` and maps it to TRIVY_PKG_TYPES; do not
      # "modernise" the key to pkg-types, the action does not accept it.
      - name: Container vulnerability scan (fail-closed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: hookrelay:ci
          format: table
          exit-code: "1"
          scanners: vuln,secret
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # Rejects a pull request whose dependency change introduces a known
  # vulnerability, before pip-audit ever sees the merged lock. Needs the
  # repository's dependency graph (enabled by default on public repositories).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
